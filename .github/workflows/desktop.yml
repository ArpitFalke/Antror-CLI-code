name: desktop-build

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Compile TypeScript
        run: npm run build

      - name: Package Windows .exe with Electron Builder
        run: npx electron-builder --win --publish never

      - name: Upload .exe as Artifact (Guaranteed Download)
        uses: actions/upload-artifact@v4
        with:
          name: Antror-Code-Desktop-Windows-Setup
          path: desktop-dist/*.exe

      - name: Attach .exe to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: "Antror Code Desktop v1.0.0"
          draft: false
          prerelease: false
          files: desktop-dist/*.exe
          fail_on_unmatched_files: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
